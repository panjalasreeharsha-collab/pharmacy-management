spring.application.name=pharmacy-management
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.servlet.session.cookie.name=MEDSTOCK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
